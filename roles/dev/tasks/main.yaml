- name: Install Base Development Tools
  ansible.builtin.apt:
    name:
      - cmake
      - meson
      - ninja-build
      - automake
      - autoconf
      - make
      - gcc
      - g++
      - clang
      - podman
    state: latest
  become: true

- name: Include Git Configuration Tasks
  ansible.builtin.include_tasks: "./git.yaml"

- name: Include Go Toolchain Tasks
  ansible.builtin.include_tasks: "./golang.yaml"

- name: Include Rust Toolchain Tasks
  ansible.builtin.include_tasks: "./rust.yaml"
